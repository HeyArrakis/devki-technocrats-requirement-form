name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          # Optional: set a repository variable named FORM_SUBMIT_EMAIL
          # (Settings → Secrets and variables → Actions → Variables) to override
          # the address in src/config.js without editing code.
          VITE_FORM_SUBMIT_EMAIL: ${{ vars.FORM_SUBMIT_EMAIL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # If Pages is still set to "Deploy from a branch", GitHub also publishes the raw
      # source on every push. Wait for that to finish so this built version lands last.
      - name: Wait for GitHub's branch publisher
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 20
          for i in $(seq 1 30); do
            pending=$(gh api "repos/${{ github.repository }}/actions/runs?head_sha=${{ github.sha }}" \
              --jq '[.workflow_runs[] | select(.name == "pages build and deployment" and .status != "completed")] | length')
            [ "$pending" = "0" ] && break
            sleep 10
          done
      - id: deployment
        uses: actions/deploy-pages@v4
